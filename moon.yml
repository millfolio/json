$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'library'
tags: ['mojo']

tasks:
  # Full CPU suite + the GPU suite (tests-check). The GPU backend is enabled
  # (loads[target="gpu"] runs on Apple Metal / NVIDIA / AMD), so the gate exercises
  # both backends and requires a Metal/GPU toolchain on the host.
  check:
    command: 'pixi run tests-check'
    toolchain: 'system'
    inputs: ['json/**/*.mojo', 'tests/**/*.mojo', 'examples/**/*.mojo', 'pixi.toml', 'pixi.lock']
